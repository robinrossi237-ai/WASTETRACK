# WasteTrack backend deployment (Docker Compose).
#
# Reference stack:
#   - PostgreSQL is external (e.g. Supabase/Neon) in production; this compose
#     includes a local Postgres for full local dev parity.
#   - `backend` depends on `db` being migrated (via `migrate`) and healthy.
#   - The `dashboard` (Vercel/Firebase) and `mobile web` (Netlify) are static
#     sites and are deployed separately, so they are intentionally not here.
#
# Usage:
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wastetrack
      POSTGRES_PASSWORD: wastetrack_password
      POSTGRES_DB: ecowaste_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastetrack -d ecowaste_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./ecowaste-backend
    command: ["node", "dist/utils/migrate.js"]
    environment:
      DATABASE_URL: postgresql://wastetrack:wastetrack_password@db:5432/ecowaste_db
      JWT_SECRET: local-non-secret-pick-a-real-one
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./ecowaste-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://wastetrack:wastetrack_password@db:5432/ecowaste_db
      JWT_SECRET: local-non-secret-pick-a-real-one
      CORS_ORIGIN: http://localhost:8081,http://localhost:8082,http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5000:5000"

volumes:
  db_data:
